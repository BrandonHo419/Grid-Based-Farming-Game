<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid-Based Farming Game</title>
<style>
html,body{margin:0;height:100%;background:#18241f;color:#eee;font:16px system-ui}
body{display:flex;flex-direction:column}header{padding:10px 16px}#game{flex:1;min-height:300px;min-width:240px;overflow:hidden}
canvas{display:block;width:100%;height:100%;outline:none}canvas:focus-visible{outline:2px solid #f1c462;outline-offset:-2px}
</style>
</head>
<body>
<header id="status" role="status">Loading…</header>
<div id="game"><canvas id="canvas" tabindex="0" aria-label="Farming game. Click to focus, then use W A S D to move." oncontextmenu="event.preventDefault()"></canvas></div>
<script>
const canvas = document.getElementById('canvas');
canvas.addEventListener('pointerdown', () => canvas.focus());
var Module = {
  canvas,
  printErr: text => console.error(text),
  onRuntimeInitialized: () => { document.getElementById('status').textContent = 'Click the game, then use WASD to move.'; },
  onAbort: () => { document.getElementById('status').textContent = 'Game could not start. Check WebGL support and the browser console.'; }
};
</script>
{{{ SCRIPT }}}
</body>
</html>
